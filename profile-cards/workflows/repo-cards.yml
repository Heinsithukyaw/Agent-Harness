name: Repo cards

# Refreshes the live repository cards on the profile README.
#
# Runs twice a day. No webhook receiver, no server, no database: the collector
# reads the GitHub GraphQL API, writes derived JSON + SVG into the repo, and
# commits as github-actions[bot]. Git history is the append-only record.
#
# Why twice a day instead of real time: GitHub webhooks have a ~10s timeout,
# no guaranteed retry, and only a 3-day manual redelivery window, so "real
# time" would mean running a public endpoint and a reconciliation loop to be
# trustworthy. A scheduled sweep of a few dozen repos costs one GraphQL
# request and is correct by construction.

on:
  schedule:
    - cron: '17 4,16 * * *' # 04:17 and 16:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-cards.mjs'
      - '.github/workflows/repo-cards.yml'

permissions:
  contents: write

concurrency:
  group: repo-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # A plain checkout leaves the bot able to commit but not to be
          # attributed as a verified author; persist-credentials keeps push simple.
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build cards
        env:
          # GITHUB_TOKEN can only see THIS repository. To enumerate private
          # repositories, add a fine-grained PAT with "Metadata: read" and
          # "Contents: read" as secrets.PROFILE_TOKEN and set PROFILE_LOGIN.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: Heinsithukyaw
          MAX_REPOS: '12'
        run: node scripts/build-cards.mjs

      - name: Enforce the write allowlist
        # The collector refuses to write outside its allowlist, but a bug in the
        # guard should not be able to reach main. This is the outer check, and
        # it fails closed: any unexpected path aborts the run before commit.
        run: |
          set -euo pipefail
          changed=$(git status --porcelain | awk '{print $2}')
          if [ -z "$changed" ]; then
            echo "nothing changed"
            exit 0
          fi
          bad=0
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              data/repos.json|data/cards.md|README.md|history/observations.jsonl|history/runs.jsonl|assets/repos/*) ;;
              *) echo "::error::unexpected write outside allowlist: $path"; bad=1 ;;
            esac
          done <<< "$changed"
          if [ "$bad" -ne 0 ]; then
            git --no-pager diff --stat
            exit 1
          fi
          echo "allowlist ok: $changed"

      - name: Commit if anything changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/ history/ assets/repos/ README.md
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore: refresh repository cards [skip ci]"
          # Rebase-and-retry guards against a concurrent push to main.
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase --autostash
          done
          echo "::error::push failed after 3 attempts"
          exit 1
