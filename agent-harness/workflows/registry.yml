name: Agent-Harness registry

# Maintains the live registry: discovers agent-harness projects, enriches the
# ones that moved, classifies them, renders cards and the site, and commits.
#
# Cadence is deliberately modest. Search allows only 30 requests/minute, and the
# collector uses the search index as its change detector so GraphQL is spent
# only on repositories that actually moved. Steady-state cost is proportional to
# churn, not to corpus size, which is why four runs a day is affordable.
#
#   daily   incremental — enrich only repositories whose stars/push time changed
#   weekly  full        — re-enrich everything, to catch what the search index
#                         does not reflect (stack drift, new manifests, renames)

on:
  schedule:
    - cron: '17 3,9,15,21 * * *' # every 6 hours
    # TEMPORARY PROBE — remove once a run with event=schedule has been observed.
    # A brand-new repository showed zero scheduled runs ever, so whether the cron
    # fires at all is an open question. This second entry fires once, at 22:31 UTC
    # on 19 September, and not again for a year, so leaving it in is harmless.
    - cron: '31 22 19 9 *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Re-enrich every repository, ignoring the change diff'
        type: boolean
        default: false
      traffic_only:
        description: 'Refresh this repository''s traffic only — no discovery or enrichment'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'collect.mjs'
      - 'render.mjs'
      - 'config/sources.json'
      - '.github/workflows/registry.yml'

permissions:
  contents: write

concurrency:
  group: agent-harness-registry
  cancel-in-progress: false

jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Decide the run mode
        id: mode
        run: |
          set -euo pipefail
          # Sunday's 03:17 run, or an explicit dispatch, does a full re-enrich.
          if [ "${{ inputs.full }}" = "true" ] || [ "$(date -u +%u%H)" = "703" ]; then
            echo "full=1" >> "$GITHUB_OUTPUT"
            echo "mode: full re-enrichment"
          else
            echo "full=0" >> "$GITHUB_OUTPUT"
            echo "mode: incremental"
          fi

      - name: Collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The traffic endpoints need push access, which GITHUB_TOKEN cannot have —
          # `administration` is not a grantable workflow permission, so /traffic/*
          # answers 403. Create a fine-grained PAT with Administration: read and
          # store it as TRAFFIC_TOKEN; the collector prefers it and falls back to
          # GITHUB_TOKEN, reporting the 403 honestly when neither can see traffic.
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          FULL: ${{ steps.mode.outputs.full }}
        run: |
          set -euo pipefail
          # Traffic rides along with every collect. The dedicated mode exists
          # because the two halves fail independently: search can be rate-limited
          # into a failed run while GitHub's fourteen-day traffic window keeps
          # sliding, and a gap longer than that window is not recoverable.
          if [ "${{ inputs.traffic_only }}" = "true" ]; then
            echo "traffic-only run"
            node collect.mjs --only-traffic
          else
            node collect.mjs
          fi

      - name: Render
        run: node render.mjs

      - name: Validate the rendered artefacts
        # A malformed SVG is invisible to any check on the generator itself: the
        # file is written, looks plausible on disk, and renders as an empty box.
        # This gate exists because that happened — a double quote inside a
        # font-family attribute terminated the attribute and every card failed
        # to parse while every other signal stayed green.
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET

          cards = sorted(glob.glob('assets/cards/*.svg'))
          if not cards:
              print('::error::no cards were rendered')
              sys.exit(1)

          bad = []
          for f in cards:
              try:
                  ET.parse(f)
              except Exception as exc:
                  bad.append(f'{f}: {exc}')

          if bad:
              for b in bad[:20]:
                  print(f'::error::malformed SVG — {b}')
              print(f'::error::{len(bad)} of {len(cards)} cards are not well-formed XML')
              sys.exit(1)
          print(f'{len(cards)} cards are well-formed XML')
          PY

          # Template leakage: an un-interpolated placeholder is a build bug that
          # is invisible until someone looks at the page.
          leaks=$(grep -c -e '\${' -e '\bundefined\b' -e '\bNaN\b' site/index.html || true)
          if [ "$leaks" -ne 0 ]; then
            echo "::error::site/index.html has $leaks line(s) with un-interpolated placeholders"
            grep -n -e '\${' -e '\bundefined\b' -e '\bNaN\b' site/index.html | head -10
            exit 1
          fi
          echo "no template leakage in site/index.html"

          # Payload and render budget. The site embeds the whole corpus, so both its
          # weight and its first-paint cost grow with the registry rather than with
          # traffic. Two cliffs, two remedies:
          #
          #   bytes -> shard the data: one JSON file per layer, fetched on demand.
          #   cards -> window the grid: render the first N, append as you scroll.
          #
          # Both stay static files on a CDN, so neither is a reason to add a backend.
          # The render budget exists because the grid rebuilds every matching card
          # through innerHTML, and the initial paint matches everything.
          #
          # This advises, it does not fail: a red step would stop the collector
          # committing, which trades a heavy page for a stale one.
          python3 - <<'PY'
          import gzip, json, os

          PAYLOAD_WARN, PAYLOAD_HARD = 500 * 1024, 1024 * 1024
          CARDS_WARN, CARDS_HARD = 2500, 4000
          SITE = 'site/index.html'
          SUMMARY = 'data/summary.json'

          raw = os.path.getsize(SITE)
          with open(SITE, 'rb') as fh:
              gz = len(gzip.compress(fh.read(), 9))

          n = json.load(open(SUMMARY)).get('projectCount', 0) or 0
          per = (gz / n) if n else 0
          room = int((PAYLOAD_WARN - gz) / per) if per and gz < PAYLOAD_WARN else 0

          def kb(b):
              return '%.0f KB' % (b / 1024.0)

          def label(v, warn, hard):
              return 'OVER HARD' if v >= hard else 'over soft' if v >= warn else 'within'

          pay, dom = label(gz, PAYLOAD_WARN, PAYLOAD_HARD), label(n, CARDS_WARN, CARDS_HARD)

          print('site/index.html: %s raw, %s gzipped, %d projects, %d B/project'
                % (kb(raw), kb(gz), n, round(per)))

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as s:
              s.write('### Payload and render budget\n\n')
              s.write('| Measure | Value | Budget |\n|---|---|---|\n')
              s.write('| Raw | %s | — |\n' % kb(raw))
              s.write('| Transferred, gzip -9 | %s | %s |\n' % (kb(gz), pay))
              s.write('| First-paint cards | %d | %s |\n' % (n, dom))
              s.write('| Per project | %d B | — |\n' % round(per))
              s.write('\n')

          if pay == 'OVER HARD':
              print('::warning::payload %s is over the hard budget %s — shard the data per layer now'
                    % (kb(gz), kb(PAYLOAD_HARD)))
          elif pay == 'over soft':
              print('::warning::payload %s is over the soft budget %s — %d projects left before the hard budget'
                    % (kb(gz), kb(PAYLOAD_WARN), int((PAYLOAD_HARD - gz) / per) if per else 0))
          else:
              print('payload %s is within budget, %d projects of headroom' % (kb(gz), room))

          if dom == 'OVER HARD':
              print('::warning::%d first-paint cards is over the hard budget %d — window the grid now'
                    % (n, CARDS_HARD))
          elif dom == 'over soft':
              print('::warning::%d first-paint cards is over the soft budget %d — %d left before the hard budget'
                    % (n, CARDS_WARN, CARDS_HARD - n))
          else:
              print('render %d first-paint cards is within budget, %d projects of headroom'
                    % (n, CARDS_WARN - n))
          PY

      - name: Enforce the write allowlist
        # The collector confines itself to data/, history/ and assets/, and this
        # is the outer check. It fails closed: any unexpected path aborts the
        # run before anything is committed.
        run: |
          set -euo pipefail
          changed=$(git status --porcelain | awk '{print $2}')
          if [ -z "$changed" ]; then
            echo "nothing changed"
            exit 0
          fi
          bad=0
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              data/*|history/*|assets/*|site/*) ;;
              *) echo "::error::unexpected write outside allowlist: $path"; bad=1 ;;
            esac
          done <<< "$changed"
          if [ "$bad" -ne 0 ]; then
            git --no-pager diff --stat
            exit 1
          fi
          echo "allowlist ok: $(echo "$changed" | wc -l) paths"

      - name: Verify the history chain
        run: |
          set -euo pipefail
          if [ ! -f history/runs.jsonl ]; then
            echo "no history yet"
            exit 0
          fi
          node -e '
          const fs = require("fs");
          const rows = fs.readFileSync("history/runs.jsonl", "utf8").trim().split("\n")
            .filter(Boolean).map(JSON.parse);
          let prev = "genesis";
          for (const r of rows) {
            if (r.prevHash !== prev) {
              console.error("::error::hash chain broken at run " + r.runId);
              process.exit(1);
            }
            prev = r.entryHash;
          }
          console.log("chain intact across " + rows.length + " runs");
          '

      - name: Commit if anything changed
        run: |
          set -euo pipefail
          # Attributed to the repository owner, not to github-actions[bot]. The
          # default Actions identity is a bot account that never appears in the
          # contributor list or on the contribution graph, so a pipeline that
          # commits four times a day produced no visible contribution history at
          # all. The commits are still obviously automated — the message says so
          # and carries [skip ci] — but the work is now credited to the account
          # that owns the pipeline. Replace both values if you drop this workflow
          # into a different account.
          git config user.name  "T@ungoodev"
          git config user.email "56247368+Heinsithukyaw@users.noreply.github.com"
          git add data/ history/ assets/ site/
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          count=$(node -e 'const s=require("./data/projects.json");console.log(s.projectCount)')
          git commit -m "chore: refresh agent-harness registry (${count} projects) [skip ci]" \
                     -m "Automated registry refresh: discover, enrich, classify, record, render."
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase --autostash
          done
          echo "::error::push failed after 3 attempts"
          exit 1

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Agent-Harness registry"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| mode | ${{ steps.mode.outputs.full == '1' && 'full' || 'incremental' }} |"
            echo "| projects | $(node -e 'try{console.log(require("./data/projects.json").projectCount)}catch{console.log("n/a")}') |"
            echo "| traffic | $(node -e 'try{const t=require("./data/traffic.json");console.log(t.views+" views / "+t.visitorDays+" visitor-days / "+t.clones+" clones over "+t.recordedDays+" recorded day(s)")}catch{console.log("n/a")}') |"
            echo "| transitions this run | $(tail -1 history/events.jsonl 2>/dev/null | wc -l) |"
          } >> "$GITHUB_STEP_SUMMARY"
